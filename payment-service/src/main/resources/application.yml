spring:
  application:
    name: payment-service
  profiles:
    active: ${profileActive:dev}
  jackson:
    time-zone: UTC
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/prism_cloud_lite
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

paddle:
  api-key: ${PADDLE_API_KEY:test_api_key}
  client-id: ${PADDLE_CLIENT_ID:test_client_id}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:test_webhook_secret}
  environment: ${PADDLE_ENVIRONMENT:sandbox}
  base-url: ${PADDLE_BASE_URL:https://sandbox-api.paddle.com}

payment-service:
  callback-base-url: ${API_CALLBACK_BASE_URL:http://localhost:8080}
  prices:
    pro-monthly: ${PADDLE_PRICE_PRO_MONTHLY:pdl_prm_demo}
    pro-yearly: ${PADDLE_PRICE_PRO_YEARLY:pdl_pry_demo}
