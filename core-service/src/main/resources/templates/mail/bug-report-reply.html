<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${productName} + ' 反馈回复'">反馈回复</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#0f172a;">
<div style="max-width:720px;margin:0 auto;padding:24px;">
    <div style="background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;">
        <div style="padding:22px 24px;background:#111827;color:#fff;">
            <div style="font-size:14px;opacity:.85;">反馈回复</div>
            <div style="font-size:20px;font-weight:800;line-height:1.2;margin-top:6px;" th:text="${productName}">Prism Cloud Lite</div>
        </div>

        <div style="padding:24px;">
            <p style="margin:0 0 12px 0;font-size:14px;line-height:1.8;color:#334155;">
                我们已收到你的反馈并进行了处理，回复如下：
            </p>

            <div style="margin:14px 0 18px 0;padding:16px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;">
                <div th:utext="${replyHtml}" style="font-size:14px;line-height:1.8;color:#0f172a;"></div>
            </div>

            <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
                如果还有其他问题，欢迎继续回复此邮件或在产品内提交新的反馈。
            </p>
        </div>
    </div>
    <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:14px;">
        <span th:text="${productName}">Prism Cloud Lite</span>
    </div>
</div>
</body>
</html>
