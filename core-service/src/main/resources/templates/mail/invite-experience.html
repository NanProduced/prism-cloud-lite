<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${productName} + ' 体验邀请'">内测邀请</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;-webkit-font-smoothing:antialiased;">
<div style="max-width:560px;margin:0 auto;padding:60px 20px;">

    <div style="margin-bottom:40px; text-align: left;">
        <div style="display:inline-block; font-size:18px; font-weight:700; color:#0f172a; letter-spacing:-0.5px;">
            <span style="background:#0f172a; color:#fff; padding:4px 8px; border-radius:6px; margin-right:8px;">P</span>
            <span th:text="${productName}">Prism Cloud Lite</span>
        </div>
    </div>

    <div style="border-top:4px solid #0f172a; padding-top:40px;">
        <h2 style="font-size:24px; font-weight:800; color:#0f172a; margin:0 0 24px 0; line-height:1.3;">
            加入我们的内测计划
        </h2>

        <p style="font-size:15px; line-height:1.8; color:#475569; margin-bottom:20px;">
            你好 <span th:if="${name != null and !#strings.isEmpty(name)}" th:text="${name}" style="font-weight:600; color:#0f172a;">朋友</span>，
        </p>

        <p style="font-size:15px; line-height:1.8; color:#475569; margin-bottom:30px;">
            我们正在构建 <span th:text="${productName}">Prism Cloud Lite</span> —— 一个轻量直观的远程播控平台。目前该平台已开启内测，我们诚挚地邀请你参与体验，帮助我们打磨产品细节。
        </p>

        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:24px; margin-bottom:40px;">
            <div style="display: flex; margin-bottom: 20px;">
                <div style="font-size:20px; margin-right:12px; line-height: 1;">✨</div>
                <div>
                    <div style="font-size:14px; font-weight:700; color:#0f172a; margin-bottom:4px;">新功能：AI Assistant</div>
                    <div style="font-size:13px; line-height:1.6; color:#64748b;">内置智能助手，可随时解答你在操作过程中的疑问。</div>
                </div>
            </div>
            <div style="display: flex;">
                <div style="font-size:20px; margin-right:12px; line-height: 1;">🐛</div>
                <div>
                    <div style="font-size:14px; font-weight:700; color:#0f172a; margin-bottom:4px;">反馈与建议</div>
                    <div style="font-size:13px; line-height:1.6; color:#64748b;">
                        内测阶段可能存在不稳定情况，你可以通过平台内的<strong style="color:#475569;">“反馈”</strong>按钮提交 Bug，我们会快速响应。
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${ctaUrl != null and !#strings.isEmpty(ctaUrl)}" style="margin-bottom:40px;">
            <a th:href="${ctaUrl}"
               style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:14px 30px; border-radius:10px; font-size:15px; font-weight:600;">
                开始内测体验
            </a>
        </div>

        <div th:if="${noteHtml != null and !#strings.isEmpty(noteHtml)}"
             style="border-left:2px solid #e2e8f0; padding-left:20px; margin-bottom:40px;">
            <div th:utext="${noteHtml}" style="font-size:14px; line-height:1.8; color:#64748b; font-style:italic;"></div>
        </div>

        <div style="padding-top:30px; border-top:1px solid #f1f5f9;">
            <p style="margin:0; font-size:13px; color:#94a3b8; line-height:1.6;">
                诚挚地，<br/>
                <strong style="color:#475569;" th:text="${productName}">Prism Cloud Lite</strong> 团队
            </p>
        </div>
    </div>
</div>
</body>
</html>
