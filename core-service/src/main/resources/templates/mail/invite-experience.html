<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${productName} + ' 体验邀请'">体验邀请</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#0f172a;">
<div style="max-width:720px;margin:0 auto;padding:24px;">
    <div style="background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;">
        <div style="padding:22px 24px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;">
            <div style="font-size:14px;opacity:.9;">邀请体验</div>
            <div style="font-size:20px;font-weight:700;line-height:1.2;margin-top:6px;" th:text="${productName}">Prism Cloud Lite</div>
        </div>

        <div style="padding:24px;">
            <p style="margin:0 0 12px 0;font-size:14px;line-height:1.6;">
                你好<span th:if="${name != null and #strings.isNotEmpty(name)}" th:text="'，' + ${name}">，朋友</span>：
            </p>
            <p style="margin:0 0 14px 0;font-size:14px;line-height:1.8;color:#334155;">
                我们邀请你体验 <span style="font-weight:700;" th:text="${productName}">Prism Cloud Lite</span>。
                如果你愿意，现在就可以点击下面按钮开始体验。
            </p>

            <div th:if="${ctaUrl != null and #strings.isNotEmpty(ctaUrl)}" style="margin:18px 0 16px 0;">
                <a th:href="${ctaUrl}"
                   style="display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:700;">
                    开始体验
                </a>
            </div>

            <div th:if="${noteHtml != null and #strings.isNotEmpty(noteHtml)}"
                 style="margin-top:14px;padding:14px 16px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;">
                <div style="font-size:12px;color:#64748b;margin-bottom:6px;">补充说明</div>
                <div th:utext="${noteHtml}" style="font-size:14px;line-height:1.7;color:#0f172a;"></div>
            </div>

            <hr style="border:none;border-top:1px solid #e5e7eb;margin:22px 0;"/>
            <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
                如需帮助或反馈问题，可直接回复此邮件（或在产品内使用“提个 bug/反馈”）。
            </p>
        </div>
    </div>
    <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:14px;">
        <span th:text="${productName}">Prism Cloud Lite</span>
    </div>
</div>
</body>
</html>
