<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${productName} + ' Pro 兑换码'">Pro 兑换码</title>
</head>
<body style="margin:0;padding:0;background:#0b1220;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#e5e7eb;">
<div style="max-width:720px;margin:0 auto;padding:24px;">
    <div style="background:#0f172a;border-radius:16px;overflow:hidden;border:1px solid #1f2937;">
        <div style="padding:22px 24px;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#0b1220;">
            <div style="font-size:14px;opacity:.85;">Pro 订阅兑换码</div>
            <div style="font-size:20px;font-weight:800;line-height:1.2;margin-top:6px;" th:text="${productName}">Prism Cloud Lite</div>
        </div>

        <div style="padding:24px;">
            <p style="margin:0 0 12px 0;font-size:14px;line-height:1.6;color:#e5e7eb;">
                你好<span th:if="${name != null and !#strings.isEmpty(name)}" th:text="'，' + ${name}">，朋友</span>：
            </p>
            <p style="margin:0 0 10px 0;font-size:14px;line-height:1.8;color:#cbd5e1;">
                这是为你生成的 <span style="font-weight:800;color:#fff;">Pro</span> 订阅兑换码
                <span th:if="${durationDays != null}" th:text="'（有效期 ' + ${durationDays} + ' 天）'">（有效期 N 天）</span>：
            </p>

            <div style="margin:16px 0 18px 0;padding:16px;border-radius:14px;background:#0b1220;border:1px solid #334155;">
                <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">兑换码</div>
                <div style="font-size:20px;font-weight:900;letter-spacing:0.08em;color:#ffffff;" th:text="${code}">XXXX-XXXX</div>
                <div th:if="${expiresAt != null}" style="font-size:12px;color:#94a3b8;margin-top:8px;">
                    过期时间：<span th:text="${#temporals.format(expiresAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</span>（UTC）
                </div>
            </div>

            <p style="margin:0 0 12px 0;font-size:14px;line-height:1.7;color:#cbd5e1;">
                使用方式：登录后进入 <span style="color:#fff;">订阅</span> 页面，选择“兑换码”并输入上述 code。
            </p>
            <div th:if="${consoleUrl != null and !#strings.isEmpty(consoleUrl)}" style="margin-top:10px;">
                <a th:href="${consoleUrl}"
                   style="display:inline-block;background:#22c55e;color:#0b1220;text-decoration:none;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:800;">
                    打开控制台
                </a>
            </div>

            <hr style="border:none;border-top:1px solid #1f2937;margin:22px 0;"/>
            <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                如需帮助或反馈问题，可直接回复此邮件。
            </p>
        </div>
    </div>
    <div style="text-align:center;font-size:12px;color:#64748b;margin-top:14px;">
        <span th:text="${productName}">Prism Cloud Lite</span>
    </div>
</div>
</body>
</html>
