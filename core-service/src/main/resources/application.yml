spring:
  application:
    name: core-service
  profiles:
    active: ${profileActive:dev}
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public, assistant;
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

assistant:
  rag:
    embedding:
      base-url: ${ASSISTANT_RAG_EMBEDDING_BASE_URL:http://127.0.0.1:7997}
      model: ${ASSISTANT_RAG_EMBEDDING_MODEL:BAAI/bge-m3}
      api-key: ${ASSISTANT_RAG_EMBEDDING_API_KEY:}
      dimension: ${ASSISTANT_RAG_EMBEDDING_DIMENSION:1024}
      batch-size: ${ASSISTANT_RAG_EMBEDDING_BATCH_SIZE:16}
    ingest:
      enabled: ${ASSISTANT_RAG_INGEST_ENABLED:false}
      exit-after-run: ${ASSISTANT_RAG_INGEST_EXIT_AFTER_RUN:true}
      doc-version: ${ASSISTANT_RAG_DOC_VERSION:dev}
      help-roots:
        - ${ASSISTANT_RAG_HELP_ROOT_ZH:../docs/help}
        - ${ASSISTANT_RAG_HELP_ROOT_EN:../docs/help-en}
      require-audience: ${ASSISTANT_RAG_REQUIRE_AUDIENCE:user}
      require-status: ${ASSISTANT_RAG_REQUIRE_STATUS:stable}
      max-docs: ${ASSISTANT_RAG_MAX_DOCS:0}
    parent:
      max-chars: ${ASSISTANT_RAG_PARENT_MAX_CHARS:6000}
      overlap-chars: ${ASSISTANT_RAG_PARENT_OVERLAP_CHARS:400}
    chunk:
      max-chars: ${ASSISTANT_RAG_CHUNK_MAX_CHARS:3200}
      overlap-chars: ${ASSISTANT_RAG_CHUNK_OVERLAP_CHARS:200}
    search:
      vector-top-k: ${ASSISTANT_RAG_VECTOR_TOP_K:0}
      fts-top-k: ${ASSISTANT_RAG_FTS_TOP_K:0}
      hybrid-top-n: ${ASSISTANT_RAG_HYBRID_TOP_N:0}
      rrf-k: ${ASSISTANT_RAG_RRF_K:60}
      rerank:
        enabled: ${ASSISTANT_RAG_RERANK_ENABLED:true}
        base-url: ${ASSISTANT_RAG_RERANK_BASE_URL:http://127.0.0.1:7998}
        model: ${ASSISTANT_RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
        top-n: ${ASSISTANT_RAG_RERANK_TOP_N:12}

  chat:
    engine: ${ASSISTANT_CHAT_ENGINE:spring-ai} # raw|spring-ai
    prompt:
      system-template: ${ASSISTANT_CHAT_SYSTEM_TEMPLATE:classpath:assistant/prompts/system.md}
    tools:
      max-rounds: ${ASSISTANT_CHAT_TOOLS_MAX_ROUNDS:3}
      max-calls-per-round: ${ASSISTANT_CHAT_TOOLS_MAX_CALLS_PER_ROUND:5}
    rag:
      enabled: ${ASSISTANT_CHAT_RAG_ENABLED:true}
      top-k: ${ASSISTANT_CHAT_RAG_TOP_K:8}
      max-context-chars: ${ASSISTANT_CHAT_RAG_MAX_CONTEXT_CHARS:12000}
      prefer-lang: ${ASSISTANT_CHAT_RAG_PREFER_LANG:auto} # auto|zh|en
    llm:
      base-url: ${ASSISTANT_CHAT_LLM_BASE_URL:http://127.0.0.1:8000}
      model: ${ASSISTANT_CHAT_LLM_MODEL:Qwen/Qwen3-8B-AWQ}
      api-key: ${ASSISTANT_CHAT_LLM_API_KEY:}
      temperature: ${ASSISTANT_CHAT_LLM_TEMPERATURE:0.2}
    providers:
      openai:
        base-url: ${ASSISTANT_CHAT_OPENAI_BASE_URL:https://api.openai.com}
        default-model: ${ASSISTANT_CHAT_OPENAI_MODEL:gpt-4o-mini}
      gemini:
        # NOTE: Gemini BYOK is provider-dependent; keep empty until confirmed.
        base-url: ${ASSISTANT_CHAT_GEMINI_BASE_URL:}
        default-model: ${ASSISTANT_CHAT_GEMINI_MODEL:gemini-1.5-flash}

    # Daily token budgets for local-vllm only (BYOK providers are not charged).
    token-budget:
      enabled: ${ASSISTANT_CHAT_TOKEN_BUDGET_ENABLED:true}
      reset-zone: ${ASSISTANT_CHAT_TOKEN_BUDGET_RESET_ZONE:UTC}
      # 0 or negative means unlimited.
      daily-limit-by-tier:
        FREE: ${ASSISTANT_CHAT_TOKEN_BUDGET_FREE_PER_DAY:20000}
        PRO: ${ASSISTANT_CHAT_TOKEN_BUDGET_PRO_PER_DAY:0}
      # Per-request completion token cap (still subject to remaining daily budget).
      max-completion-tokens-by-tier:
        FREE: ${ASSISTANT_CHAT_TOKEN_BUDGET_FREE_MAX_COMPLETION_TOKENS:512}
        PRO: ${ASSISTANT_CHAT_TOKEN_BUDGET_PRO_MAX_COMPLETION_TOKENS:4096}

  credentials:
    master-key: ${PRISM_AI_CREDENTIALS_MASTER_KEY:} # base64-encoded 32-byte key for AES-GCM
