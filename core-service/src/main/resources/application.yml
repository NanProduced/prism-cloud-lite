spring:
  application:
    name: core-service
  threads:
    virtual:
      enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
logging:
  level:
    nan.produced.prism.core: INFO

# ==================== 媒体上传配置 ====================
prism:
  media:
    s3:
      region: ${AWS_REGION:ap-northeast-1}
      bucket: ${AWS_S3_BUCKET:prism-media-library}
      # endpoint: # 留空使用 AWS S3，或设置为 MinIO 等兼容存储的地址
      presigned-url-expiration-minutes: 15
    upload:
      routes:
        # 素材库上传路由
        mediaLibrary:
          allowed-types:
            - "video/*"
            - "image/*"
            - "audio/*"
          max-file-size: 5368709120  # 5GB
          max-files: 10
          multipart-enabled: true
          multipart-part-size: 52428800  # 50MB
          multipart-threshold: 104857600  # 100MB
          path-prefix: media
          storage-class: STANDARD
          public-access: false
        # 头像上传路由（示例）
        avatar:
          allowed-types:
            - "image/jpeg"
            - "image/png"
            - "image/webp"
          max-file-size: 5242880  # 5MB
          max-files: 1
          multipart-enabled: false
          path-prefix: avatars
          storage-class: STANDARD
          public-access: false